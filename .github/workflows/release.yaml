name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write # publish chart to gh-pages branch
  packages: write # publish chart to ghcr.io

jobs:
  release-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.0

      - name: Update Helm Repository and Cache
        run: |
          helm repo add datenreisende https://datenreisende.github.io/charts/
          helm repo update

      - name: Update All Other Chart Dependencies
        run: |
          for d in charts/* ; do
            if [[ "$d" != "charts/helmlet" ]]; then
              helm dependency update "$d"
            fi
          done
          
      # Publish OCI charts to ghcr.io
      - name: Generate charts
        run: |
          mkdir -p .cr-release-packages
          for d in charts/* ; do
            helm package "$d" --destination .cr-release-packages
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_SECRET }}

      - name: Publish Charts to GHCR
        run: |
          for pkg in .cr-release-packages/*; do
            echo ${pkg}
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" oci://ghcr.io/datenreisende/charts
          done

  release-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.0

      # Publish charts to gh-pages branch
      - name: Publish charts to GitHub Pages
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: .github/configs/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.REGISTRY_SECRET }}"

  update-readme:
    runs-on: ubuntu-latest
    needs: release-ghcr
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Update Helm Charts Table in README
        run: |
          # Generate new table
          {
            echo "## Available Helm Charts"
            echo ""
            echo "| Chart Name | Version | Type |"
            echo "|------------|---------|------|"
            for d in charts/* ; do
              chart_name=$(basename "$d")
              chart_version=$(helm show chart "$d" | grep '^version:' | awk '{print $2}')
              chart_type=$(helm show chart "$d" | grep '^type:' | awk '{print $2}')
              [ -z "$chart_type" ] && chart_type="application"
              echo "| $chart_name | $chart_version | $chart_type |"
            done
            echo ""
          } > charts-section.txt

          # Remove existing charts section, then insert fresh one before "## How to Add"
          awk '/## Available Helm Charts/{skip=1} /## How to Add This Repository/{skip=0} !skip' README.md > README.tmp
          awk '/## How to Add This Repository/{system("cat charts-section.txt")} 1' README.tmp > README.md
          rm README.tmp charts-section.txt

      - name: Commit changes
        run: |
          git add README.md
          git commit -m "docs: update README with Helm charts table including chart type"
          git push

      - name: Merge main to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git merge origin/main --no-edit
          git push origin gh-pages